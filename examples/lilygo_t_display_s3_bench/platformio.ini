; LilyGO T-Display-S3 (ESP32-S3 + ST7789 170×320) — compare-suite MCU benchmark.
; Requires compare deps from repo root:  make compare-deps
;
; Build / flash / serial monitor:
;   cd examples/lilygo_t_display_s3_bench
;   pio run -t upload -t monitor
;
[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32@^7.0.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    robtillaart/FastTrig@^0.3.6

; Pull benchmark sources from repo root (paths relative to src/)
build_src_filter =
    +<*>
    +<../../../compare/benchmark_core.c>
    +<../../../src/qf_math.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/fix16.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/fract32.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/uint32.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/fix16_trig.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/fix16_sqrt.c>
    +<../../../build/compare/third_party/libfixmath/libfixmath/fix16_exp.c>
    +<../../../build/compare/third_party/fr_math/src/FR_math.c>

build_flags =
    -I${PROJECT_DIR}/../../compare
    -I${PROJECT_DIR}/../../src
    -I${PROJECT_DIR}/../../build/compare/third_party/libfixmath/libfixmath
    -I${PROJECT_DIR}/../../build/compare/third_party/fr_math/src
    -DFIXMATH_NO_CACHE
    -DFR_NO_PRINT
    -DARDUINO_LOOP_STACK_SIZE=65536
    -Wno-unused-parameter
    -Wno-sign-conversion
    -Wno-conversion
